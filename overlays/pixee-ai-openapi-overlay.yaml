x-source: API Evangelist enrichment pipeline
actions:
- target: $.info
  description: Annotate provenance and cross-cutting conventions.
  update:
    x-hypermedia: HAL (Hypertext Application Language) — responses carry _links; traverse from /api/v1.
    x-rate-limit:
      standard: { requests_per_minute: 60, burst: 10 }
      enterprise: { requests_per_minute: 300, burst: 50 }
    x-error-format: "custom envelope { error: { code, message, request_id } } (not RFC 9457)"
