- target: $.paths['/webhooks'].post
  description: Document the full documented webhook event catalog.
  update:
    x-webhook-events:
    - fix.generated
    - pr.opened
    - pr.merged
    - pr.closed
    - triage.completed
    - scan.completed
    x-webhook-signing: shared secret provided at registration; see asyncapi/pixee-ai-webhooks-asyncapi.yml
- target: $.paths['/repositories'].get
  description: Note HAL pagination support.
  update:
    x-pagination: HAL link-based; follow _links (CLI --paginate).
