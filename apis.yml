aid: pixee-ai
name: Pixee
description: >-
  Pixee is an agentic security engineering (AppSec) platform — "your automated product
  security engineer." It ingests findings from SAST, SCA, and IaC scanners as SARIF,
  runs a three-tier triage engine that classifies each vulnerability with auditable,
  timestamped evidence, and delivers remediations as native pull requests across GitHub,
  GitLab, Azure DevOps, and Bitbucket using deterministic codemods plus quality-evaluated
  AI fixes. Pixee exposes a HAL-based REST API (organization-scoped bearer tokens),
  documented webhooks, a first-party CLI with bundled agent skills, and the open-source
  Codemodder framework (Java and Python). It is backed by Wing Venture Capital.
